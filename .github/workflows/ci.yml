name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev/serve extras
        # ruff is pinned: an unpinned linter installs whatever shipped most
        # recently, so whether the build is green depends on the date it ran
        # rather than on what was committed.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve,dev]" ruff==0.16.3

      - name: Lint
        run: ruff check .

      - name: Run test suite
        # Includes the checks that need no dataset: that no patient straddles
        # the committed split, that a label-only split *would* have leaked, and
        # that the committed model still reproduces the committed metrics.
        run: pytest -q

      - name: Does the site's data still match the artifacts?
        # Regenerates the web data from the committed model, metrics and patient
        # map and diffs it against what is committed. Needs no dataset -- every
        # input is small and in the repo -- so the page cannot quietly describe
        # a model that is no longer the one being shipped.
        run: python scripts/export_web_artifacts.py --check

      - name: Import-check the serving app
        run: python -c "from liver_hcc import serve; print('serve import OK')"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Does the browser still reproduce scikit-learn?
        # Re-predicts all 72 held-out biopsies with the module the page ships
        # and compares against scikit-learn's committed answers. This is what
        # makes "the models run in your browser" a fact rather than a hope --
        # it catches a changed export, a changed gene order, or arithmetic that
        # has quietly drifted.
        run: npm run check:golden

      - name: Build the static site
        run: npm run build
