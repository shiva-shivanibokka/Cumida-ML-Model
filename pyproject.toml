[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-hcc"
version = "1.0.0"
description = "Liver HCC classification from GSE14520 microarray gene expression"
readme = "README.md"
license = {file = "LICENSE"}
# 3.11 is the floor the test matrix actually covers; claiming 3.9 was untested.
requires-python = ">=3.11"
# Core runtime: everything needed to train the model AND serve a prediction.
# Kept deliberately lean so the serving image (`.[serve]`) stays small.
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    # Pinned to the exact version, not a range, because this repo *ships a
    # pickle*. artifacts/model.joblib was written by 1.8.0 and scikit-learn
    # 1.9.1 cannot read it -- `ModuleNotFoundError: No module named '_loss'`,
    # which names nothing a reader would connect to a version skew. A range
    # here means CI resolves to whatever is newest and fails on an artifact
    # that is perfectly good.
    #
    # The ceiling would have been needed anyway: LogisticRegression's
    # `penalty=` is deprecated in 1.8 and removed in 1.10, and the tuned model
    # is specified with it. Its replacement (`l1_ratio=1`) is a silent no-op
    # before 1.8 -- it fits L2 while looking like L1 -- so no single spelling
    # is correct across a range.
    "scikit-learn==1.8.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
# Training/notebook-only libs: plotting + the optional Bayesian search
# (models.py falls back to RandomizedSearchCV when scikit-optimize is absent).
# Not installed into the serving image.
train = ["scikit-optimize>=0.9", "matplotlib>=3.5", "seaborn>=0.12"]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
# Points into the package, not at the repo-root train.py. The previous target
# (`train:main`) was never packaged by `packages = ["liver_hcc"]`, so an
# installed console script raised ModuleNotFoundError on every invocation --
# invisible in editable mode, where the repo root is already importable.
liver-hcc-train = "liver_hcc.train:main"

[tool.setuptools]
packages = ["liver_hcc"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
