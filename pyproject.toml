[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-hcc"
version = "1.0.0"
description = "Liver HCC classification from GSE14520 microarray gene expression"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "scikit-optimize>=0.9",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "joblib>=1.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
liver-hcc-train = "train:main"

[tool.setuptools]
packages = ["liver_hcc"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
